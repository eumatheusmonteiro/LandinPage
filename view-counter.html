<!-- view-counter.html -->
<!-- Componente que mostra quantas pessoas estão vendo o produto agora. -->
<div
  id="view-counter"
  class="view-counter"
  aria-live="polite"
  aria-atomic="true"
>
  <div class="view-counter__icon">👀</div>
  <div class="view-counter__content">
    <div class="view-counter__text">
      <span class="view-counter__value">18</span> pessoas estão visualizando
      este produto agora.
    </div>
    <div class="view-counter__meta">
      🔥 4 pessoas adicionaram ao carrinho hoje · 🎉 2 compras realizadas nas
      últimas horas.
    </div>
  </div>
</div>
